    function toggleStats() {
        const main = document.getElementById('main-view');
        const stats = document.getElementById('stats-page');
        if (main.style.display === 'none') {
            main.style.display = 'block';
            stats.style.display = 'none';
        } else {
            main.style.display = 'none';
            stats.style.display = 'block';
            updateStatsDisplay();
        }
    }

    function addEntry(cal, p, f, k) {
        data.cal += cal;
        data.p += p;
        data.f += f;
        data.k += k;
        localStorage.setItem('mamaData', JSON.stringify(data));
        alert("Hinzugefügt! Weiter so, Mama!");
        updateStatsDisplay();
    }

    function updateStatsDisplay() {
        document.getElementById('total-cal').innerText = data.cal;
        document.getElementById('total-p').innerText = data.p;
        document.getElementById('total-f').innerText = data.f;
        document.getElementById('total-k').innerText = data.k;
    }

    function resetStats() {
        if(confirm("Alles auf Null setzen?")) {
            data = { cal: 0, p: 0, f: 0, k: 0 };
            localStorage.setItem('mamaData', JSON.stringify(data));
            updateStatsDisplay();
        }
    }

    function setCat(cat, btn) {
        currentCat = cat;
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function render() {
        const tasteFilter = document.getElementById('flavor').value;
        const container = document.getElementById('content');
        container.innerHTML = '';
        const filtered = recipes.filter(r => (tasteFilter === 'alle' || r.tag === tasteFilter) && r.cat === currentCat);

        filtered.forEach(r => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="taste-badge">${r.tag.toUpperCase()}</div>
                <h2>${r.t}</h2>
                <div class="nutrients-small">${r.cal} kcal | P: ${r.p}g | F: ${r.f}g | KH: ${r.k}g</div>
                <span class="label">Das brauchst du:</span>
                <p>${r.i.join(', ')}</p>
                <span class="label">Schritt für Schritt:</span>
                <p>${r.s}</p>
                <button class="add-btn" onclick="addEntry(${r.cal}, ${r.p}, ${r.f}, ${r.k})">+ Zum Tagebuch hinzufügen</button>
            `;
            container.appendChild(card);
        });
    }

    // Beim Laden direkt Frühstück anzeigen
    window.onload = render;
